{# Simple line icons, drawn on a 24x24 grid. Decorative: always pair with text. #}
{% macro icon(name, class="icon") -%}
<svg class="{{ class }}" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "gear" -%}
  <circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/><circle cx="12" cy="12" r="6.5"/>
{%- elif name == "leaf" -%}
  <path d="M5 19c0-8.5 5-14 15-14 0 10-5.5 15-13.5 15"/><path d="M5 19l8.5-8.5"/>
{%- elif name == "code" -%}
  <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6M12 17v4M10 8.5l-2 2 2 2M14 8.5l2 2-2 2"/>
{%- elif name == "book" -%}
  <path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-13c-3.5 0-6 .5-8 2z"/><path d="M12 6.5v13"/>
{%- elif name == "chart" -%}
  <path d="M4 20h16M7 16.5v-4M12 16.5V7.5M17 16.5v-7"/>
{%- elif name == "heart" -%}
  <path d="M12 20s-7.5-4.6-7.5-10.2A4.1 4.1 0 0 1 12 7.5a4.1 4.1 0 0 1 7.5 2.3C19.5 15.4 12 20 12 20z"/><path d="M8 12.5h2.2l1-2 1.6 4 1-2H16"/>
{%- elif name == "truck" -%}
  <path d="M3 6h11v10H3zM14 9.5h3.8l3.2 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>
{%- elif name == "pen" -%}
  <path d="M4 20l1-4.5L16 4.5l3.5 3.5-11 11z"/><path d="M13.5 7l3.5 3.5"/>
{%- elif name == "award" -%}
  <circle cx="12" cy="9" r="5.5"/><path d="M8.8 13.5 7.5 21l4.5-2.3 4.5 2.3-1.3-7.5"/>
{%- elif name == "pin" -%}
  <path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/>
{%- elif name == "clipboard" -%}
  <rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 4.5V3h6v1.5M8.5 10h7M8.5 14h7M8.5 18h4"/>
{%- elif name == "briefcase" -%}
  <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4.5h6V7M3 12.5h18"/>
{%- elif name == "steps" -%}
  <path d="M4 19h5v-5h5V9h6"/><path d="M17 6l3 3-3 3"/>
{%- elif name == "arrow-left" -%}
  <path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "arrow-right" -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "info" -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/>
{%- endif -%}
</svg>
{%- endmacro %}
